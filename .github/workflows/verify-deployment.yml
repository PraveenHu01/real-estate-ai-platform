# Catches, in CI, the failures that only appear on Vercel's Linux builders:
# case-sensitive imports, files that were never committed, and build errors
# that a warm local node_modules hides.
name: verify-deployment

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest   # Linux on purpose: reproduces Vercel's case sensitivity
    steps:
      - uses: actions/checkout@v4

      # Must match .vercel/project.json nodeVersion and package.json engines.
      # A mismatch is how native deps (@node-rs/argon2) pass here and fail there.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (same command Vercel runs)
        run: npm run install:all

      - name: Build (same command Vercel runs)
        id: build
        run: npm run build

      # A committed import of an uncommitted file builds fine locally and dies
      # on Vercel with MODULE_NOT_FOUND. A fresh clone is the only honest check.
      - name: Verify the serverless function can be required
        run: node -e "require('./api/index.js'); console.log('api/index.js loads OK')"

      - name: Verify icon imports resolve
        run: cd frontend && node check-icons.cjs

      - name: Audit environment variables
        run: node check-env.js

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const shortSha = sha.slice(0, 7);
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? `✅ **Verification passed** on Node 22 (Linux) — matches Vercel.\n\nCommit \`${shortSha}\` should deploy cleanly.`
              : `❌ **Verification failed** — Vercel will fail too, and your production URL will keep serving the last good deploy.\n\nCommit \`${shortSha}\`. See the job log above.`;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } catch (err) {
              console.warn('Failed to post PR comment (check permissions or fork PR):', err.message);
            }
